name = "exameow"
main = "src/index.ts"
compatibility_date = "2025-07-16"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "exam.superagentparty.com", custom_domain = true },
]

[vars]
CF_ACCOUNT_ID = "25fcdd133593b796985d219a18c94732"

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "EXAM_DB"
database_name = "exameow-exams"
database_id = "90c1f699-947e-40f6-acf2-3c1fc8f0b462"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ATTEMPT_IMAGES"
bucket_name = "exameow-attempt-images"

[triggers]
crons = ["15 4 * * *"]

[observability]
enabled = true
